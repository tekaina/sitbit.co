<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SitBit — Redirecting</title>
  <script>
    (function() {
      // Single Page Application deep link forwarder for GitHub Pages.
      // Preserves /group-sessions/{id}, /session/{id}, /invite/{id}, and /play routes.
      var path = window.location.pathname;
      var search = window.location.search;
      var hash = window.location.hash;
      var fullTarget = path + search + hash;
      
      try {
        sessionStorage.setItem('sitbit_redirect_target', fullTarget);
      } catch (e) {}

      var target = '/?redirect=' + encodeURIComponent(fullTarget);
      window.location.replace(target);
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #fffdfa; color: #141210; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0;">
  <div style="text-align: center; padding: 24px;">
    <div style="width: 48px; height: 48px; border: 4px solid #ff6b35; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px;"></div>
    <h2 style="font-size: 20px; font-weight: 700; margin-bottom: 8px;">Opening SitBit...</h2>
    <p style="color: #6f6a63; font-size: 14px; margin: 0;">Preserving your game link</p>
  </div>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</body>
</html>
